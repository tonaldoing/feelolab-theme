name: Release

# Publica una versión cuando llega a main una que todavía no tiene release.
#
# - El código fuente queda en este repo (privado). Los zips se publican en un repo PÚBLICO
#   que solo tiene releases: los sitios se actualizan sin token (feelolab-core/src/Updater.php).
# - Necesita el secret RELEASES_TOKEN: token fine-grained con Contents: Read and write
#   SOLO sobre el repo de releases.
# - En este repo deja el tag vX.Y.Z apuntando al commit publicado.
on:
  push:
    branches: [main]
    paths:
      - 'feelolab/style.css'
      - 'feelolab-core/feelolab-core.php'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  RELEASES_REPO: tonaldoing/feelolab-releases

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hay token para publicar
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::Falta el secret RELEASES_TOKEN (Settings → Secrets and variables → Actions)."; exit 1; }

      - name: ¿Versión nueva?
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V=$(grep -m1 '^Version:' feelolab/style.css | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "v$V ya está publicada en $RELEASES_REPO: no hay nada que hacer."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Las cuatro versiones coinciden
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          THEME_CONST=$(grep -oP "FEELOLAB_VERSION', '\K[^']+" feelolab/functions.php)
          PLUGIN=$(grep -m1 'Version:' feelolab-core/feelolab-core.php | awk '{print $3}')
          PLUGIN_CONST=$(grep -oP "FEELO_CORE_VERSION', '\K[^']+" feelolab-core/feelolab-core.php)
          echo "style.css=$V functions.php=$THEME_CONST plugin=$PLUGIN/$PLUGIN_CONST"
          for v in "$THEME_CONST" "$PLUGIN" "$PLUGIN_CONST"; do
            [ "$v" = "$V" ] || { echo "::error::Versiones distintas. Actualizá style.css, functions.php y feelolab-core.php."; exit 1; }
          done

      - name: Sintaxis PHP
        if: steps.version.outputs.new == 'true'
        run: find feelolab feelolab-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Armar zips (la carpeta raíz de cada zip es el nombre del tema/plugin)
        if: steps.version.outputs.new == 'true'
        run: |
          zip -qr feelolab.zip feelolab -x '*.DS_Store'
          zip -qr feelolab-core.zip feelolab-core -x '*.DS_Store'
          unzip -l feelolab.zip | tail -1; unzip -l feelolab-core.zip | tail -1

      - name: Notas de la versión (sección del CHANGELOG)
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## "v" " || $0 == "## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versión $V." > notes.md
          cat notes.md

      - name: update.json (lo lee el actualizador de los sitios; CDN de GitHub, sin límite de consultas)
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          BASE="https://github.com/$RELEASES_REPO/releases/download/v$V"
          jq -n --arg v "$V" --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$RELEASES_REPO/releases/tag/v$V" \
            --arg theme "$BASE/feelolab.zip" --arg plugin "$BASE/feelolab-core.zip" \
            '{version: $v, date: $date, url: $url, notes: $notes, theme: $theme, plugin: $plugin}' > update.json
          cat update.json

      - name: Publicar en el repo de releases
        id: publish
        if: steps.version.outputs.new == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            feelolab.zip
            feelolab-core.zip
            update.json

      - name: Esperar antes de reintentar (la API de GitHub a veces da timeout)
        if: steps.version.outputs.new == 'true' && steps.publish.outcome == 'failure'
        run: sleep 30

      - name: Publicar en el repo de releases (reintento)
        if: steps.version.outputs.new == 'true' && steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            feelolab.zip
            feelolab-core.zip
            update.json

      - name: Tag en este repo (qué commit es cada versión)
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$V" -f sha="$GITHUB_SHA" >/dev/null \
            || echo "::warning::El tag v$V ya existía en este repo."
