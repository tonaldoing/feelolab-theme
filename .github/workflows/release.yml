name: Release

# Pushear un tag vX.Y.Z publica el Release con feelolab.zip y feelolab-core.zip.
# Los sitios lo ven en Escritorio → Actualizaciones (feelolab-core/src/Updater.php).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Las cuatro versiones coinciden con el tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          THEME=$(grep -m1 '^Version:' feelolab/style.css | awk '{print $2}')
          THEME_CONST=$(grep -oP "FEELOLAB_VERSION', '\K[^']+" feelolab/functions.php)
          PLUGIN=$(grep -m1 'Version:' feelolab-core/feelolab-core.php | awk '{print $3}')
          PLUGIN_CONST=$(grep -oP "FEELO_CORE_VERSION', '\K[^']+" feelolab-core/feelolab-core.php)
          echo "tag=$TAG tema=$THEME/$THEME_CONST plugin=$PLUGIN/$PLUGIN_CONST"
          for v in "$THEME" "$THEME_CONST" "$PLUGIN" "$PLUGIN_CONST"; do
            [ "$v" = "$TAG" ] || { echo "::error::Versión $v distinta del tag $TAG. Actualizá style.css, functions.php y feelolab-core.php."; exit 1; }
          done

      - name: Sintaxis PHP
        run: find feelolab feelolab-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Armar zips (la carpeta raíz de cada zip es el nombre del tema/plugin)
        run: |
          zip -qr feelolab.zip feelolab -x '*.DS_Store'
          zip -qr feelolab-core.zip feelolab-core -x '*.DS_Store'
          unzip -l feelolab.zip | tail -1; unzip -l feelolab-core.zip | tail -1

      - name: Notas de la versión (sección del CHANGELOG)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '$0 ~ "^## "v" " || $0 == "## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versión $TAG." > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            feelolab.zip
            feelolab-core.zip
