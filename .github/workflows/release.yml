name: Release

# Publica el Release (tag vX.Y.Z + feelolab.zip + feelolab-core.zip) cuando llega a main una versión
# que todavía no tiene release: subir la versión y pushear alcanza, el tag lo crea esta Action.
# Los sitios lo ven en Escritorio → Actualizaciones (feelolab-core/src/Updater.php).
on:
  push:
    branches: [main]
    paths:
      - 'feelolab/style.css'
      - 'feelolab-core/feelolab-core.php'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Versión nueva?
        id: version
        run: |
          V=$(grep -m1 '^Version:' feelolab/style.css | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V ya está publicada: no hay nada que hacer."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Las cuatro versiones coinciden
        if: steps.version.outputs.new == 'true'
        run: |
          TAG="${{ steps.version.outputs.version }}"
          THEME=$(grep -m1 '^Version:' feelolab/style.css | awk '{print $2}')
          THEME_CONST=$(grep -oP "FEELOLAB_VERSION', '\K[^']+" feelolab/functions.php)
          PLUGIN=$(grep -m1 'Version:' feelolab-core/feelolab-core.php | awk '{print $3}')
          PLUGIN_CONST=$(grep -oP "FEELO_CORE_VERSION', '\K[^']+" feelolab-core/feelolab-core.php)
          echo "tag=$TAG tema=$THEME/$THEME_CONST plugin=$PLUGIN/$PLUGIN_CONST"
          for v in "$THEME" "$THEME_CONST" "$PLUGIN" "$PLUGIN_CONST"; do
            [ "$v" = "$TAG" ] || { echo "::error::Versiones distintas ($THEME / $THEME_CONST / $PLUGIN / $PLUGIN_CONST). Actualizá style.css, functions.php y feelolab-core.php."; exit 1; }
          done

      - name: Sintaxis PHP
        if: steps.version.outputs.new == 'true'
        run: find feelolab feelolab-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Armar zips (la carpeta raíz de cada zip es el nombre del tema/plugin)
        if: steps.version.outputs.new == 'true'
        run: |
          zip -qr feelolab.zip feelolab -x '*.DS_Store'
          zip -qr feelolab-core.zip feelolab-core -x '*.DS_Store'
          unzip -l feelolab.zip | tail -1; unzip -l feelolab-core.zip | tail -1

      - name: Notas de la versión (sección del CHANGELOG)
        if: steps.version.outputs.new == 'true'
        run: |
          TAG="${{ steps.version.outputs.version }}"
          awk -v v="$TAG" '$0 ~ "^## "v" " || $0 == "## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versión $TAG." > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            feelolab.zip
            feelolab-core.zip
